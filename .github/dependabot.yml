version: 2

updates:
  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: daily
    groups:
      devcontainers-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"

    groups:
      datamodel-code-generator:
        patterns:
          - "datamodel-code-generator"

      other-dependencies:
        exclude-patterns:
          - "datamodel-code-generator"
        patterns:
          - "*"


  - package-ecosystem: npm
    directory: "/src/sbom_generator/deps/npm"
    schedule:
      interval: daily
    groups:
      cyclonedx-npm-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/src/sbom_generator/deps/yarn"
    schedule:
      interval: daily
    groups:
      cyclonedx-yarn-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/src/sbom_generator/deps/esbuild"
    schedule:
      interval: daily
    groups:
      cyclonedx-esbuild-dependencies:
        patterns:
          - "*"

  - package-ecosystem: bundler
    directory: "/src/sbom_generator/deps/ruby"
    schedule:
      interval: daily
    groups:
      cyclonedx-ruby-dependencies:
        patterns:
          - "*"
